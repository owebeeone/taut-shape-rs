name: Publish taut-shape to crates.io

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup component add clippy
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p taut-shape --no-default-features --locked
      - run: cargo package -p taut-shape --locked

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
      - name: Require tag/crate version agreement
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test "$version" = "${GITHUB_REF_NAME#v}"
      - run: cargo publish -p taut-shape --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
