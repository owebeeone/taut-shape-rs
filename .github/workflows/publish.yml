name: Publish taut-shape to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  test:
    name: Test crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/taut-shape-rs
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/taut-shape-rs
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/taut-shape
          path: workspace/taut-shape
      - run: rustup component add clippy
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p taut-shape --no-default-features --locked
      - run: cargo package -p taut-shape --locked

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
      - name: Require tag/crate version agreement
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' crates/taut-shape/Cargo.toml)
          test "$version" = "${RELEASE_TAG#v}"
      - name: Publish if this immutable version is absent
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' crates/taut-shape/Cargo.toml)
          if curl --fail --silent --show-error \
            --header 'User-Agent: taut-shape-release-workflow' \
            "https://crates.io/api/v1/crates/taut-shape/$version" >/dev/null; then
            echo "taut-shape $version is already published"
          else
            cargo publish -p taut-shape --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
