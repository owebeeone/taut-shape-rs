name: Publish taut-shape to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify
        required: false

      foundation_source_sha:
        description: Exact Taut commit for foundation-only preflight or publication
        required: false
      foundation_version:
        description: Foundation crate version
        default: "0.12.0"
        required: false
      publish_foundation:
        description: Publish foundation after verification of its immutable Taut tag
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.foundation_source_sha }}
    name: Test crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/taut-shape-rs
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/taut-shape-rs
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/taut-shape
          path: workspace/taut-shape
      - run: rustup component add clippy
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p taut-shape --no-default-features --locked
      - run: cargo package -p taut-shape --locked

  publish:
    if: ${{ !inputs.foundation_source_sha }}
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    environment: crates-io
    # crates.io trusted publishing: the job's OIDC token buys a short-lived crates.io token, so the
    # repository holds none. crates.io's publisher for taut-shape names this workflow, release.yml.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require tag/crate version agreement
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' crates/taut-shape/Cargo.toml)
          test "$version" = "${RELEASE_TAG#v}"
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish if this immutable version is absent
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' crates/taut-shape/Cargo.toml)
          if curl --fail --silent --show-error \
            --header 'User-Agent: taut-shape-release-workflow' \
            "https://crates.io/api/v1/crates/taut-shape/$version" >/dev/null; then
            echo "taut-shape $version is already published"
          else
            cargo publish -p taut-shape --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  foundation:
    if: ${{ inputs.foundation_source_sha }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ inputs.foundation_source_sha }}
      FOUNDATION_VERSION: ${{ inputs.foundation_version }}
      PUBLISH: ${{ inputs.publish_foundation }}
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - name: Require explicit immutable input
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOUNDATION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v6
        with:
          path: publisher
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/taut
          ref: ${{ inputs.foundation_source_sha }}
          fetch-depth: 0
          path: source
      - name: Select the qualified Rust release toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify source, canonical payload and release identity
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python rust/sync_foundation.py --check
          python - <<'PY'
          import os, pathlib, sys, tomllib
          sys.path.insert(0, str(pathlib.Path("../publisher/scripts").resolve()))
          from publish_foundation import validate_foundation_manifest
          p = tomllib.loads(pathlib.Path('rust/taut-foundation/Cargo.toml').read_text())
          assert p['package']['name'] == 'taut-foundation'
          assert p['package']['version'] == os.environ['FOUNDATION_VERSION']
          assert p['package'].get('publish') is not False
          validate_foundation_manifest(p)
          PY
          if [ "$PUBLISH" = true ]; then
            test "$(git rev-parse "refs/tags/v$FOUNDATION_VERSION^{commit}")" = "$SOURCE_SHA"
          fi
      - name: Test both feature modes and isolated registry payload
        working-directory: source
        run: |
          cargo test --manifest-path rust/taut-foundation/Cargo.toml --no-default-features
          cargo test --manifest-path rust/taut-foundation/Cargo.toml --all-features
          cargo package --manifest-path rust/taut-foundation/Cargo.toml
          if [ "$PUBLISH" != true ]; then
            cargo publish --manifest-path rust/taut-foundation/Cargo.toml --dry-run
          fi
      - name: Exchange GitHub OIDC identity for a short-lived registry token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish canonical foundation through trusted publishing
        if: inputs.publish_foundation
        working-directory: source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python ../publisher/scripts/publish_foundation.py --version "$FOUNDATION_VERSION" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        if: inputs.publish_foundation && success()
        with:
          name: foundation-publication
          path: source/foundation-publication.json
