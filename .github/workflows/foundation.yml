name: Publish canonical taut-foundation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed commit in owebeeone/taut
        required: true
      version:
        description: Exact foundation crate version
        required: true
      publish:
        description: Publish after checks (requires the matching immutable Taut tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: taut-foundation-publication
  cancel-in-progress: false

jobs:
  foundation:
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      FOUNDATION_VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish }}
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - name: Require explicit immutable input
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOUNDATION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v6
        with:
          path: publisher
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/taut
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Select the qualified Rust release toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify source, canonical payload and release identity
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python rust/sync_foundation.py --check
          python - <<'PY'
          import os, pathlib, tomllib
          p = tomllib.loads(pathlib.Path('rust/taut-foundation/Cargo.toml').read_text())
          assert p['package']['name'] == 'taut-foundation'
          assert p['package']['version'] == os.environ['FOUNDATION_VERSION']
          assert p['package'].get('publish') is not False
          assert not p.get('dependencies'), 'foundation must remain dependency-free'
          PY
          if [ "$PUBLISH" = true ]; then
            test "$(git rev-parse "refs/tags/v$FOUNDATION_VERSION^{commit}")" = "$SOURCE_SHA"
          fi
      - name: Test both feature modes and isolated registry payload
        working-directory: source
        run: |
          cargo test --manifest-path rust/taut-foundation/Cargo.toml --no-default-features
          cargo test --manifest-path rust/taut-foundation/Cargo.toml --all-features
          cargo package --manifest-path rust/taut-foundation/Cargo.toml
          if [ "$PUBLISH" != true ]; then
            cargo publish --manifest-path rust/taut-foundation/Cargo.toml --dry-run
          fi
      - name: Require bootstrap credential presence
        if: ${{ !inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish initial foundation through the existing registry environment
        if: inputs.publish
        working-directory: source
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python ../publisher/scripts/publish_foundation.py --version "$FOUNDATION_VERSION" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        if: inputs.publish && success()
        with:
          name: foundation-publication
          path: source/foundation-publication.json
