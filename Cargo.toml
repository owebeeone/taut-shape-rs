[workspace]
resolver = "2"
members = [
    "crates/taut-shape",
    "crates/taut-shape-tool",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/owebeeone/taut-shape-rs"
rust-version = "1.75"

[workspace.lints.rust]
# The core crate must stay no_std-clean; unsafe is not needed anywhere yet.
unsafe_code = "forbid"

# The foundation is an unreleased local crate maintained in base taut. External
# applications supply this same patch, or bind every consumer to their generated
# source owner. No crates.io publication or generation-time install is required.
[patch.crates-io]
taut-foundation = { path = "../taut/rust/taut-foundation" }
