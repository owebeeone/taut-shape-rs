# SELF-CONTAINED MANIFEST: concrete literals rather than `*.workspace = true`
# inheritance, so external workspaces that splice/vendor this manifest (rules_rust
# crate_universe, future publish) do not hit dangling inheritance. Keep in sync
# with ../../Cargo.toml [workspace.package] by hand. Nothing external splices this
# tool crate today, but it is made self-contained to match its sibling.
[package]
name = "taut-shape-tool"
description = "Conformance/interop CLI for taut-shape-rs (gen/check/node/client)."
version = "0.9.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/owebeeone/taut-shape-rs"
rust-version = "1.75"
publish = false

# Inlined from [workspace.lints.rust].
[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "taut-shape-tool"
path = "src/main.rs"

[dependencies]
# The tool is little more than the engine + framing (InitialPlan §4). It uses
# the core with its `std` shell; the framing/CBOR layer lands in Phase 4.
taut-shape = { path = "../taut-shape", features = ["std"] }

[dev-dependencies]
# The integration test spawns the built bin and hand-builds/decodes frames
# with the same `cbor`/`generated` surface the tool speaks.
taut-shape = { path = "../taut-shape", features = ["std"] }
